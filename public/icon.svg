<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428"/>
      <stop offset="50%" stop-color="#0d2146"/>
      <stop offset="100%" stop-color="#07101e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="lightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#1e3a8a" stroke-width="2" opacity="0.4"/>

  <!-- NEXA Symbol: Stylized connected dynamic 'N' with cashflow upward vector -->
  <g transform="translate(48, 48) scale(0.8125)">
    <!-- Upward trend dynamic background glow -->
    <path d="M 96 384 L 208 192 L 304 288 L 416 128" fill="none" stroke="#2563eb" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity="0.25" filter="url(#glow)"/>
    
    <!-- NEXA Sharp Geometric 'N' & Cash Flow Arrows -->
    <!-- Left Pillar -->
    <path d="M 120 128 L 176 128 L 176 384 L 120 384 Z" fill="url(#accentGrad)" rx="6"/>
    
    <!-- Diagonal Dynamic Ribbon -->
    <path d="M 176 128 L 336 384 L 280 384 L 120 128 Z" fill="url(#lightGrad)" opacity="0.95"/>
    
    <!-- Right Pillar with Growth Chevron -->
    <path d="M 336 128 L 392 128 L 392 384 L 336 384 Z" fill="url(#accentGrad)" rx="6"/>

    <!-- Upward Cash Flow Arrowhead Accent -->
    <polygon points="364,76 416,136 312,136" fill="#38bdf8" filter="url(#glow)"/>
    
    <!-- Flow Nodes / Currency dots -->
    <circle cx="208" cy="240" r="10" fill="#38bdf8" />
    <circle cx="304" cy="310" r="8" fill="#60a5fa" />
  </g>
</svg>
