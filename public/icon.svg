<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep midnight sapphire background with radial brilliance -->
    <radialGradient id="radialGlow" cx="50%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="35%" stop-color="#0f172a"/>
      <stop offset="70%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Metallic electric cobalt / sky fintech gradient -->
    <linearGradient id="valoraPrimary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="80%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Emerald success glow accent -->
    <linearGradient id="valoraAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Premium glass / silver highlights -->
    <linearGradient id="glassRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#e0f2fe" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#7dd3fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Subtle rim bevel lighting -->
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="ultraGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="32" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Squircle Base / App Canvas -->
  <rect width="512" height="512" rx="118" fill="url(#radialGlow)"/>
  
  <!-- Outer metallic stroke / Chamfer highlight -->
  <rect x="6" y="6" width="500" height="500" rx="112" fill="none" stroke="url(#rimLight)" stroke-width="3.5"/>

  <!-- Subtle grid dots / fintech security mesh -->
  <g opacity="0.12" fill="#38bdf8">
    <circle cx="128" cy="110" r="2.5"/>
    <circle cx="256" cy="110" r="2.5"/>
    <circle cx="384" cy="110" r="2.5"/>
    <circle cx="128" cy="402" r="2.5"/>
    <circle cx="256" cy="402" r="2.5"/>
    <circle cx="384" cy="402" r="2.5"/>
  </g>

  <!-- Ambient background glow under the emblem -->
  <circle cx="256" cy="256" r="140" fill="#0284c7" opacity="0.16" filter="url(#ultraGlow)"/>

  <!-- Geometric Vault Diamond Foundation -->
  <rect x="110" y="110" width="292" height="292" rx="72" transform="rotate(45 256 256)" fill="#0f172a" stroke="#1e293b" stroke-width="4" filter="url(#softShadow)"/>
  <rect x="116" y="116" width="280" height="280" rx="66" transform="rotate(45 256 256)" fill="none" stroke="url(#rimLight)" stroke-width="2" opacity="0.5"/>

  <!-- VALORA EMBLEM: Interlocking Ascendant 'V' Precision Wings -->
  <g filter="url(#softShadow)">
    <!-- Left Ascending Wing -->
    <path d="M 170 170 L 250 370 C 253 376 259 376 262 370 L 290 310 L 220 140 C 215 130 196 132 188 144 Z" fill="url(#valoraPrimary)"/>

    <!-- Right Ascending Emerald-Cyan Apex Wing -->
    <path d="M 342 170 L 262 370 C 259 376 253 376 250 370 L 222 310 L 292 140 C 297 130 316 132 324 144 Z" fill="url(#valoraAccent)"/>

    <!-- Core Vault Node (Wealth Nucleus) -->
    <circle cx="256" cy="260" r="22" fill="#38bdf8" filter="url(#ultraGlow)"/>
    <circle cx="256" cy="260" r="11" fill="#ffffff"/>
  </g>
</svg>
